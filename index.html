            // ★ 즐겨찾기 -> 메인 화면 Swap 이동 (소켓 완전 파괴 후 메인 꽂음)
            sendFavToMain: function(id, event) {
                if (event) event.stopPropagation();
                if (State.isEditMode) return;
                
                var fav = this.favorites.find(f => f.id === id);
                if(!fav) return;

                if(State.cctvClickTimer) clearTimeout(State.cctvClickTimer);
                
                document.getElementById('video-title').innerText = '[송출] ' + fav.name;
                document.getElementById('btn-fav-add').style.display = 'none'; 
                
                if (this.map) {
                    this.map.setView([fav.lat, fav.lng], 12, { animate: true });
                }
                
                // ★ SWAP 핵심: 즐겨찾기에서 보고 있던 영상을 바로 끊고 메인에 소켓을 몰아줌
                if(this.favHlsInstances[id]) {
                    this.favHlsInstances[id].destroy();
                    this.favHlsInstances[id] = null;
                }
                var loader = document.getElementById('loader-' + id);
                if(loader) {
                    loader.style.display = 'flex';
                    loader.innerHTML = '▶ 메인 송출 중...';
                }
                var video = document.getElementById('fav-video-' + id);
                if(video) video.style.opacity = '0';

                this.manageSocketsForMain();
                
                // 마커 클릭과 완전히 동일한 플레이 명령 (API 거치지 않고 캐시된 URL로 즉각 폭발)
                this.playCCTVStream(fav.url, { name: fav.name, lat: fav.lat, lng: fav.lng, url: fav.url });
                UI.showToast(fav.name + ' 영상을 메인 화면으로 전환합니다.', '#10b981');
            },

            initFavVideo: function(id, url) {
                if (!url) return;
                var secureUrl = url.replace(/^http:\/\//i, 'https://'); 
                var video = document.getElementById('fav-video-' + id);
                var loader = document.getElementById('loader-' + id);
                if (!video) return;

                if(loader) {
                    loader.innerHTML = '<div class="video-loader" style="width:20px; height:20px; border-width:2px; margin-bottom:6px;"></div><span style="font-size:11px; color:var(--success); font-weight:bold;">영상 연결 중...</span>';
                    loader.style.display = 'flex';
                }

                var self = this;
                var favName = this.favorites.find(f => f.id === id)?.name || '';

                var startHls = () => {
                    if (self.favHlsInstances[id]) {
                        self.favHlsInstances[id].destroy();
                    }
                    var hls = new Hls({ 
                        enableWorker: false, 
                        lowLatencyMode: true,
                        manifestLoadingMaxRetry: 1, 
                        maxBufferLength: 10,
                        maxMaxBufferLength: 20,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 10
                    }); 
                    
                    hls.loadSource(secureUrl);
                    hls.attachMedia(video);
                    
                    video.addEventListener('canplay', () => {
                        if (loader) loader.style.display = 'none';
                        video.style.opacity = '1';
                    });

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(()=>{});
                    });
                    
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                if (loader) {
                                    loader.innerHTML = '<span style="color:var(--accent2); font-weight:bold;">네트워크 지연</span><br><span style="font-size:9px; color:#aaa;">터치 시 재연결</span>';
                                }
                                hls.destroy();
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hls.recoverMediaError(); 
                            } else {
                                hls.destroy();
                                if (loader) {
                                    loader.innerHTML = '🔄<br><span style="font-size:10px; color:var(--success)">자동 갱신 중...</span>';
                                }
                                self.autoRefreshFavoriteUrl(id, favName); 
                            }
                        }
                    });
                    self.favHlsInstances[id] = hls;
                };

                if (Hls.isSupported()) {
                    startHls();
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = secureUrl;
                    video.addEventListener('error', () => {
                        if (loader) loader.innerHTML = '🔄<br><span style="font-size:10px; color:var(--success)">자동 갱신 중...</span>';
                        self.autoRefreshFavoriteUrl(id, favName);
                    });
                    video.addEventListener('loadedmetadata', () => video.play().catch(()=>{}));
                    video.addEventListener('canplay', () => {
                        if (loader) loader.style.display = 'none';
                        video.style.opacity = '1';
                    });
                }
            },
            
            autoRefreshFavoriteUrl: async function(id, name) {
                var fav = this.favorites.find(f => f.id === id);
                if(!fav) return;

                var minX = (fav.lng - 0.05).toFixed(5);
                var maxX = (fav.lng + 0.05).toFixed(5);
                var minY = (fav.lat - 0.05).toFixed(5);
                var maxY = (fav.lat + 0.05).toFixed(5);
                var q = '?apiKey=' + CONFIG.API.ITS_KEY + '&type=ex&cctvType=1&minX=' + minX + '&maxX=' + maxX + '&minY=' + minY + '&maxY=' + maxY + '&getType=json';
                
                try {
                    var proxyUrl = CONFIG.API.PROXY_BASE + encodeURIComponent(CONFIG.API.ITS_BASE + q);
                    var res = await fetchWithTimeout(proxyUrl, { timeout: 6000 });
                    var rawData = await res.text();
                    var cctvDataArray = await parseITSDataAsync(rawData);
                    
                    var match = cctvDataArray.find(c => c.cctvname === name);
                    if(match && match.cctvurl) {
                        fav.url = match.cctvurl; 
                        this.saveFavorites(); 
                        this.initFavVideo(id, fav.url); 
                    } else {
                        var loader = document.getElementById('loader-' + id);
                        if(loader) { loader.innerHTML = '<span style="color:var(--danger)">서버 영상 없음</span><br><span style="font-size:9px; color:#aaa;">CCTV 점검 중</span>'; }
                    }
                } catch(e) {
                    var loader = document.getElementById('loader-' + id);
                    if(loader) { loader.innerHTML = '<span style="color:var(--danger)">서버 응답 없음</span><br><span style="font-size:9px; color:#aaa;">터치하여 수동 재시도</span>'; }
                }
            },

            fetchFavoritesWeather: function() {
                this.favorites.forEach(async function(fav) {
                    try {
                        var w = await CacheStore.getWeather(fav.lat, fav.lng);
                        var p = parseWeather(w.weathercode);
                        var el = document.getElementById('fav-w-' + fav.id);
                        if (el) el.innerHTML = `<span style="color:${p.color}">${p.icon}</span> ${w.temperature}℃`;
                        
                        var card = document.getElementById('fav-card-' + fav.id);
                        if(card) {
                            card.style.background = p.bg;
                            card.style.borderColor = p.color;
                        }
                    } catch (e) {}
                });
            },

            loadSpatialData: async function() {
                UI.showLoading('공간 데이터 로딩');
                try {
                    if (!CacheStore.sidoGeoJSON || !CacheStore.sigunguGeoJSON) {
                        var [sidoRes, sigunguRes] = await Promise.all([
                            fetchWithTimeout(CONFIG.API.SIDO_GEOJSON), fetchWithTimeout(CONFIG.API.SIGUNGU_GEOJSON)
                        ]);
                        CacheStore.sidoGeoJSON = await sidoRes.json();
                        CacheStore.sigunguGeoJSON = await sigunguRes.json();
                    }
                    this.renderGeoLayer(CacheStore.sidoGeoJSON, 1);
                } catch (e) { UI.showToast('공간 통신 오류', '#ef4444'); } finally { UI.hideLoading(); }
            },

            renderGeoLayer: function(geoJsonData, targetLevel) {
                var self = this;
                if (this.geoLayer) { this.geoLayer.clearLayers(); this.map.removeLayer(this.geoLayer); }
                this.geoLayer = L.geoJSON(geoJsonData, {
                    style: { color: targetLevel === 1 ? '#3b82f6' : '#a855f7', weight: targetLevel === 1 ? 2 : 1.5, fillOpacity: 0.06 },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function(e) {
                            if (self.currentLevel >= 2) return; 
                            
                            if (targetLevel === 1) self.handleSidoClick(feature.properties.code, feature.properties.name, layer.getBounds());
                            else self.handleSigunguClick(feature.properties.name, layer.getBounds());
                        });
                    }
                }).addTo(this.map);
            },

            fetchNationwideCCTV: async function() {
                try {
                    var q = '?apiKey=' + CONFIG.API.ITS_KEY + '&type=ex&cctvType=1&minX=124.0&maxX=132.0&minY=33.0&maxY=39.0&getType=json';
                    var proxyUrl = CONFIG.API.PROXY_BASE + encodeURIComponent(CONFIG.API.ITS_BASE + q);
                    var res = await fetchWithTimeout(proxyUrl, { timeout: 8000 });
                    var rawData = await res.text();
                    var cctvDataArray = await parseITSDataAsync(rawData);
                    
                    if (cctvDataArray && cctvDataArray.length > 0) {
                        State.nationwideCCTVs = cctvDataArray;
                        cctvDataArray.forEach(c => CCTVMemory.add(c.coordy, c.coordx));
                        if (this.currentLevel === 0) this.renderCCTVDots(cctvDataArray, false, true);
                    }
                } catch(e) {}
            },

            handleSidoClick: async function(sidoCode, name, bounds) {
                this.currentLevel = 1; State.fromSearch = false; State.parentSidoCode = null; State.parentSidoName = null; 
                State.activeRegionName = name; this.currentFocusBounds = bounds; 
                UI.updateHeader('[' + name + '] 하위 구역 확인'); UI.resetWeatherWidget(); this.map.fitBounds(bounds);
                
                this.clearCCTVResources(true); 
                this.fetchActualCCTVData(bounds, false);

                var filtered = {
                    type: CacheStore.sigunguGeoJSON.type,
                    features: CacheStore.sigunguGeoJSON.features.filter(f => String(f.properties.code).indexOf(String(sidoCode)) === 0)
                };
                this.renderGeoLayer(filtered, 2); 
                this.fetchLocalWeather(this.geoLayer);
            },

            handleSigunguClick: function(name, bounds) {
                this.currentLevel = 2; State.fromSearch = false; 
                this.currentFocusBounds = bounds; State.activeRegionName = name; 
                this.map.fitBounds(bounds);
                UI.updateHeader('관측 대상: ' + name);
                
                this.infoLabelLayer.clearLayers(); 
                var center = bounds.getCenter();
                this.showSearchWeatherMarker(name, center.lat, center.lng); 
                
                this.clearCCTVResources(true); 
                this.fetchActualCCTVData(bounds, false);
                this.fetchWeatherData(center.lat, center.lng); 
            },

            executeDirectSearch: function(name, lat, lng, autoPlay, forceUrl) {
                autoPlay = autoPlay || false; forceUrl = forceUrl || '';
                if (State.isEditMode) return;
                this.currentLevel = 2; State.fromSearch = true; State.activeRegionName = name; 
                UI.updateHeader('관측 지점: ' + name);

                var matchedFeature = null; var matchedBounds = null; var matchedName = name;
                State.parentSidoCode = null; State.parentSidoName = null;

                if (CacheStore.sigunguGeoJSON && CacheStore.sigunguGeoJSON.features) {
                    var exactMatch = CacheStore.sigunguGeoJSON.features.find(f => f.properties.name === name);
                    
                    if (exactMatch) {
                        matchedFeature = exactMatch;
                        matchedBounds = L.geoJSON(exactMatch).getBounds();
                        matchedName = exactMatch.properties.name;
                        if (exactMatch.properties && exactMatch.properties.code) {
                            var sidoCode = String(exactMatch.properties.code).substring(0, 2); State.parentSidoCode = sidoCode;
                        }
                    } else {
                        for (var i = 0; i < CacheStore.sigunguGeoJSON.features.length; i++) {
                            var f = CacheStore.sigunguGeoJSON.features[i];
                            try {
                                var layer = L.geoJSON(f);
                                if (layer.getBounds().contains([lat, lng])) {
                                    matchedFeature = f; matchedBounds = layer.getBounds(); matchedName = name;
                                    if (f.properties && f.properties.code) {
                                        var sidoCode = String(f.properties.code).substring(0, 2); State.parentSidoCode = sidoCode;
                                    }
                                    break;
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (this.geoLayer) { this.geoLayer.clearLayers(); this.map.removeLayer(this.geoLayer); }
                this.infoLabelLayer.clearLayers();

                if (matchedFeature && matchedBounds) {
                    this.geoLayer = L.geoJSON(matchedFeature, { style: { color: '#a855f7', weight: 2, fillOpacity: 0.08 } }).addTo(this.map);
                    this.map.fitBounds(matchedBounds, { maxZoom: 12, padding: [20, 20] }); this.currentFocusBounds = matchedBounds;
                } else {
                    var pad = 0.06; var bounds = L.latLngBounds([lat - pad, lng - pad], [lat + pad, lng + pad]);
                    this.map.fitBounds(bounds, { maxZoom: 12, padding: [20, 20] }); this.currentFocusBounds = bounds;
                }

                this.fetchWeatherData(lat, lng); this.showSearchWeatherMarker(matchedName, lat, lng);

                if (autoPlay && forceUrl) {
                    this.clearCCTVResources(true); this.renderCCTVDots([{ cctvname: name, coordy: lat, coordx: lng, cctvurl: forceUrl }]);
                    document.getElementById('video-title').innerText = '[송출] ' + name;
                    this.playCCTVStream(forceUrl, { name: name, lat: lat, lng: lng, url: forceUrl });
                } else { this.fetchActualCCTVData(this.currentFocusBounds, false, 1, autoPlay); }
            },

            fetchWeatherData: async function(lat, lon) {
                var widget = document.getElementById('weather-widget'); widget.style.display = 'block';
                document.getElementById('weather-condition').innerText = '분석 중';
                try {
                    var w = await CacheStore.getWeather(lat, lon);
                    State.currentWeather = w;
                    var now = new Date(); var p = parseWeather(w.weathercode);
                    widget.style.background = p.bg;
                    widget.style.borderColor = p.color;
                    document.getElementById('weather-time').innerText = `시각: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    document.getElementById('weather-condition').innerHTML = `${p.icon} <span style="color:${p.color}">${p.text}</span>`;
                    document.getElementById('weather-temp').innerText = `온도: ${w.temperature}℃`;
                    document.getElementById('weather-wind').innerText = `풍속: ${w.windspeed} km/h`;
                    document.getElementById('weather-status').innerText = `분석: ${p.rain}`;
                    document.getElementById('weather-status').style.color = p.color;
                } catch (e) { UI.showToast('기상 수신 실패', '#ef4444'); }
            },

            fetchActualCCTVData: async function(bounds, isBroadSearch, attempt, autoPlay) {
                isBroadSearch = isBroadSearch || false; attempt = attempt || 1; autoPlay = autoPlay || false;
                if (!isBroadSearch) this.clearCCTVResources(true);
                if (!isBroadSearch) UI.showLoading('인프라 좌표 렌더링');

                CacheStore.purgeExpiredCCTVCache();
                var cacheKey = bounds.getWest().toFixed(2) + '_' + bounds.getEast().toFixed(2) + '_' + bounds.getSouth().toFixed(2) + '_' + bounds.getNorth().toFixed(2);
                var cached = CacheStore.cctvDataMap.get(cacheKey);

                if (cached && (Date.now() - cached.timestamp < CONFIG.CCTV_CACHE_TTL)) {
                    State.currentCCTVs = cached.data;
                    this.renderCCTVDots(cached.data, autoPlay);
                    this.updateWeatherCCTVBadges();
                    if (!isBroadSearch) UI.hideLoading(); return;
                }

                var center = bounds.getCenter(); var padVal = attempt === 1 ? 0.07 : 0.14;
                var minX = (center.lng - padVal).toFixed(5); var maxX = (center.lng + padVal).toFixed(5);
                var minY = (center.lat - padVal).toFixed(5); var maxY = (center.lat + padVal).toFixed(5);

                var q = '?apiKey=' + CONFIG.API.ITS_KEY + '&type=ex&cctvType=1&minX=' + minX + '&maxX=' + maxX + '&minY=' + minY + '&maxY=' + maxY + '&getType=json';

                try {
                    var proxyUrl = CONFIG.API.PROXY_BASE + encodeURIComponent(CONFIG.API.ITS_BASE + q);
                    var res = await fetchWithTimeout(proxyUrl, { timeout: 6000 });
                    var rawData = await res.text();
                    var cctvDataArray = await parseITSDataAsync(rawData);

                    if (!cctvDataArray || cctvDataArray.length === 0) {
                        if (attempt === 1 && !isBroadSearch) return this.fetchActualCCTVData(bounds, false, 2, autoPlay);
                        if (!isBroadSearch) UI.showToast('해당 반경 가용 채널 없음', '#ef4444');
                        return;
                    }

                    cctvDataArray.forEach(c => CCTVMemory.add(c.coordy, c.coordx));
                    
                    State.currentCCTVs = cctvDataArray;
                    CacheStore.cctvDataMap.set(cacheKey, { timestamp: Date.now(), data: cctvDataArray });
                    
                    this.renderCCTVDots(cctvDataArray, autoPlay);
                    this.updateWeatherCCTVBadges();

                } catch (error) {
                    if (!isBroadSearch) UI.showToast('서버 응답 지연', '#ef4444');
                } finally { UI.hideLoading(); }
            },

            // ★ 이벤트 버블링 차단 및 팻-핑거(Fat Finger) 투명 쉴드 터치 적용
            renderCCTVDots: function(cctvArray, autoPlay, isNationwide = false) {
                autoPlay = autoPlay || false; var self = this;
                var currentZoom = this.map.getZoom();
                var radiusSize = currentZoom < 9 ? 2.5 : (currentZoom < 12 ? 4.5 : 6.0);

                cctvArray.forEach(function(cctv, i) {
                    if (State.renderedCCTVs.has(cctv.cctvurl)) return;
                    State.renderedCCTVs.add(cctv.cctvurl);

                    var marker = L.circleMarker([cctv.coordy, cctv.coordx], {
                        radius: radiusSize,
                        color: currentZoom < 9 ? 'transparent' : '#ffffff', 
                        weight: currentZoom < 9 ? 10 : 2, 
                        fillColor: '#ef4444',
                        fillOpacity: 0.9,
                        renderer: canvasRenderer
                    });
                    
                    marker.on('click', function(e) {
                        L.DomEvent.stopPropagation(e); // 지도 뒤로 튕김 완벽 차단!
                        
                        var z = self.map.getZoom();
                        var rs = z < 9 ? 2.5 : (z < 12 ? 4.5 : 6.0);
                        
                        if (State.activeMarker) State.activeMarker.setStyle({ fillColor: '#ef4444', radius: rs, color: z < 9 ? 'transparent' : '#ffffff' });
                        marker.setStyle({ fillColor: '#10b981', radius: rs + 3, color: '#ffffff', weight: 2 });
                        State.activeMarker = marker;

                        document.getElementById('video-title').innerText = `[송출] ${cctv.cctvname}`;
                        document.getElementById('btn-fav-add').style.display = 'inline-block'; 
                        
                        // ★ 마커를 클릭하면 메인 뷰어 자원을 확보하기 위해 강제 할당
                        self.manageSocketsForMain();
                        
                        // 지연 없이 다이렉트 샷 (0ms Delay) - 모바일 오토플레이 락 해제
                        self.playCCTVStream(cctv.cctvurl, { name: cctv.cctvname, lat: cctv.coordy, lng: cctv.coordx, url: cctv.cctvurl });
                    });
                    
                    self.cctvLayer.addLayer(marker);

                    if (autoPlay && i === 0 && !isNationwide) marker.fire('click');
                });
                
                if (this.cctvLayer) this.cctvLayer.bringToFront();
            },

            autoRefreshMainUrl: async function(cctvObj) {
                var minX = (cctvObj.lng - 0.05).toFixed(5);
                var maxX = (cctvObj.lng + 0.05).toFixed(5);
                var minY = (cctvObj.lat - 0.05).toFixed(5);
                var maxY = (cctvObj.lat + 0.05).toFixed(5);
                var q = '?apiKey=' + CONFIG.API.ITS_KEY + '&type=ex&cctvType=1&minX=' + minX + '&maxX=' + maxX + '&minY=' + minY + '&maxY=' + maxY + '&getType=json';
                try {
                    var proxyUrl = CONFIG.API.PROXY_BASE + encodeURIComponent(CONFIG.API.ITS_BASE + q);
                    var res = await fetchWithTimeout(proxyUrl, { timeout: 6000 });
                    var rawData = await res.text();
                    var cctvDataArray = await parseITSDataAsync(rawData);
                    
                    var match = cctvDataArray.find(c => c.cctvname === cctvObj.name);
                    if(match && match.cctvurl) {
                        cctvObj.url = match.cctvurl;
                        var fav = this.favorites.find(f => f.name === cctvObj.name);
                        if(fav) {
                            fav.url = cctvObj.url;
                            this.saveFavorites();
                        }
                        this.playCCTVStream(cctvObj.url, cctvObj);
                        UI.showToast('스트림을 최신 상태로 갱신했습니다.', '#10b981');
                    } else {
                        UI.showToast('CCTV 서버에서 영상 송출을 중단했습니다.', '#ef4444');
                        var placeholder = document.getElementById('main-loader');
                        if(placeholder) {
                            placeholder.innerHTML = '<span style="color:var(--danger); font-weight:bold;">영상 제공 중단됨</span><br><span style="font-size:11px; color:#aaa;">(국가교통정보센터 점검 등)</span>';
                        }
                    }
                } catch(e) {
                    UI.showToast('CCTV 서버 응답 지연', '#ef4444');
                    var placeholder = document.getElementById('main-loader');
                    if(placeholder) {
                        placeholder.innerHTML = '<span style="color:var(--danger); font-weight:bold;">서버 응답 지연</span><br><span style="font-size:11px; color:#aaa;">통신 불안정으로 수신 실패</span>';
                    }
                }
            },

            playCCTVStream: function(streamUrl, cctvObj) {
                var wrapper = document.getElementById('video-content'); var badge = document.getElementById('video-badge');
                State.activeCCTV = cctvObj; State.hlsRetryCount = 0;
                State.nativeMainRetryCount = 0;
                
                document.getElementById('btn-pip').style.display = 'inline-block';
                document.getElementById('btn-fullscreen').style.display = 'inline-block';
                document.getElementById('btn-fav-add').style.display = 'inline-block';
                
                if (this.hlsInstance) { 
                    this.hlsInstance.stopLoad();
                    this.hlsInstance.detachMedia();
                    this.hlsInstance.destroy(); 
                    this.hlsInstance = null; 
                }

                wrapper.innerHTML = '<div class="placeholder" id="main-loader" style="z-index:2; background:#000;"><div class="video-loader"></div><span id="main-loader-text" style="color:var(--success); font-weight:bold; margin-top:8px;">채널 연결 중...</span></div><video id="cctv-player" controls autoplay muted playsinline style="display:block; opacity:0; transition:opacity 0.4s ease; width:100%; height:100%; position:absolute; inset:0; z-index:1; object-fit:contain; transform:translateZ(0);"></video>';
                var video = document.getElementById('cctv-player');
                var placeholder = document.getElementById('main-loader');
                badge.innerText = '연결 중'; badge.className = 'video-badge';

                var secureStreamUrl = streamUrl.replace(/^http:\/\//i, 'https://');

                if (Hls.isSupported()) {
                    this.hlsInstance = new Hls({ 
                        enableWorker: true, 
                        lowLatencyMode: true,
                        maxBufferLength: 10,
                        maxMaxBufferLength: 20,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 10
                    });
                    
                    var watchdog = setTimeout(() => {
                        if (this.hlsInstance) {
                            this.hlsInstance.destroy();
                            this.hlsInstance = null;
                            badge.innerText = 'TIMEOUT';
                            if(placeholder) {
                                placeholder.innerHTML = '<span style="color:var(--danger); font-weight:bold;">서버 응답 지연 (Timeout)</span><br><span style="font-size:11px; color:#aaa;">자동 복구 중...</span>';
                                placeholder.style.display = 'flex';
                            }
                            this.autoRefreshMainUrl(cctvObj);
                        }
                    }, 8000);

                    this.hlsInstance.loadSource(secureStreamUrl);
                    this.hlsInstance.attachMedia(video);
                    
                    video.addEventListener('canplay', () => {
                        clearTimeout(watchdog);
                        if (placeholder) placeholder.style.display = 'none';
                        video.style.opacity = '1';
                        badge.innerText = 'LIVE'; badge.className = 'video-badge active';
                    });

                    this.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        clearTimeout(watchdog);
                        video.play().catch(()=>{});
                    });
                    
                    var self = this;
                    this.hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            clearTimeout(watchdog);
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    if (State.hlsRetryCount < 3) {
                                        State.hlsRetryCount++;
                                        setTimeout(() => { if (self.hlsInstance) self.hlsInstance.startLoad(); }, 1500);
                                    } else {
                                        badge.innerText = 'ERROR'; UI.showToast('연결 실패 (네트워크 제약)', '#ef4444');
                                        if (self.hlsInstance) self.hlsInstance.destroy();
                                        if (placeholder) {
                                            placeholder.innerHTML = '<span style="color:var(--danger); font-weight:bold;">영상 신호를 수신할 수 없습니다.</span><br><span style="font-size:11px; color:#aaa;">네트워크 연결을 확인하세요</span>';
                                            placeholder.style.display = 'flex';
                                        }
                                    }
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    if (self.hlsInstance) self.hlsInstance.recoverMediaError(); break;
                                default:
                                    badge.innerText = 'RENEW'; 
                                    UI.showToast('스트림을 갱신합니다.', '#f59e0b');
                                    if (self.hlsInstance) self.hlsInstance.destroy();
                                    if (placeholder) {
                                        placeholder.innerHTML = '<div class="video-loader"></div><span style="color:var(--success); font-weight:bold; margin-top:8px;">최신 주소 갱신 중...</span>';
                                        placeholder.style.display = 'flex';
                                    }
                                    self.autoRefreshMainUrl(cctvObj);
                                    break;
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = secureStreamUrl;
                    
                    var nativeWatchdog = setTimeout(() => {
                        if (placeholder) {
                            placeholder.innerHTML = '<span style="color:var(--danger); font-weight:bold;">서버 응답 지연</span><br><span style="font-size:11px; color:#aaa;">자동 복구 중...</span>';
                        }
                        self.autoRefreshMainUrl(cctvObj);
                    }, 8000);

                    video.addEventListener('error', () => {
                        clearTimeout(nativeWatchdog);
                        State.nativeMainRetryCount++;
                        if (State.nativeMainRetryCount <= 2) {
                            if (placeholder) {
                                placeholder.innerHTML = '<div class="video-loader"></div><span style="color:var(--success); font-weight:bold; margin-top:8px;">최신 주소 갱신 중...</span>';
                                placeholder.style.display = 'flex';
                            }
                            self.autoRefreshMainUrl(cctvObj);
                        } else {
                            if (placeholder) {
                                placeholder.innerHTML = '<span style="color:var(--danger); font-weight:bold;">연결 불가</span><br><span style="font-size:11px; color:#aaa;">서버 응답 없음</span>';
                                placeholder.style.display = 'flex';
                            }
                            badge.innerText = 'ERROR';
                        }
                    });

                    video.addEventListener('loadedmetadata', () => {
                        clearTimeout(nativeWatchdog);
                        video.play().catch(()=>{});
                    });
                    video.addEventListener('canplay', () => {
                        clearTimeout(nativeWatchdog);
                        State.nativeMainRetryCount = 0; 
                        if (placeholder) placeholder.style.display = 'none';
                        video.style.opacity = '1';
                        badge.innerText = 'LIVE'; badge.className = 'video-badge active';
                    });
                }
            },

            clearCCTVResources: function(keepMarkers = false) {
                if (this.hlsInstance) { 
                    this.hlsInstance.stopLoad(); this.hlsInstance.detachMedia(); this.hlsInstance.destroy(); this.hlsInstance = null; 
                }
                var wrapper = document.getElementById('video-content');
                if (wrapper) {
                    var video = wrapper.querySelector('video');
                    if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
                    wrapper.innerHTML = '<div class="placeholder">지도 상의 인프라 마커(빨간 점) 또는<br>하단 채널을 선택하세요</div>';
                }
                if (!keepMarkers && this.cctvLayer) {
                    this.cctvLayer.clearLayers();
                    State.renderedCCTVs.clear();
                }
                var badge = document.getElementById('video-badge');
                if (badge) { badge.innerText = '대기'; badge.className = 'video-badge'; }
                State.activeCCTV = null; 
                State.activeMarker = null; 
                document.getElementById('btn-fav-add').style.display = 'none';
                document.getElementById('btn-pip').style.display = 'none';
                document.getElementById('btn-fullscreen').style.display = 'none';
            },

            goBack: function() {
                this.clearCCTVResources(true); UI.resetWeatherWidget(); this.currentFocusBounds = null; State.activeRegionName = null;
                if (this.currentLevel === 2) {
                    if (State.fromSearch && State.parentSidoCode) {
                        this.currentLevel = 1; State.fromSearch = false;
                        var sidoName = State.parentSidoName || '상위 구역';
                        UI.updateHeader('[' + sidoName + '] 하위 구역 확인');
                        var filtered = {
                            type: CacheStore.sigunguGeoJSON.type,
                            features: CacheStore.sigunguGeoJSON.features.filter(f => String(f.properties.code).indexOf(State.parentSidoCode) === 0)
                        };
                        this.renderGeoLayer(filtered, 2);
                        if (this.geoLayer) this.map.fitBounds(this.geoLayer.getBounds(), { padding: [20, 20] });
                        this.fetchLocalWeather(this.geoLayer);
                        State.parentSidoCode = null; State.parentSidoName = null;
                    } else {
                        this.currentLevel = 0; State.fromSearch = false;
                        UI.updateHeader('시스템 동기화 완료 · 관측 대상 시/도를 선택하세요');
                        this.renderGeoLayer(CacheStore.sidoGeoJSON, 1);
                        this.fetchGlobalWeather(); this.map.setView([35.8, 127.5], 7);
                        if(State.nationwideCCTVs.length > 0) this.renderCCTVDots(State.nationwideCCTVs, false, true);
                    }
                } else if (this.currentLevel === 1) {
                    this.currentLevel = 0; UI.updateHeader('시스템 동기화 완료 · 관측 대상 시/도를 선택하세요');
                    this.renderGeoLayer(CacheStore.sidoGeoJSON, 1);
                    this.fetchGlobalWeather(); this.map.setView([35.8, 127.5], 7);
                    if(State.nationwideCCTVs.length > 0) this.renderCCTVDots(State.nationwideCCTVs, false, true);
                }
            },

            resetMap: function() { this.currentLevel = 2; State.fromSearch = false; State.parentSidoCode = null; State.parentSidoName = null; this.goBack(); }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
