<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역 검색 및 CCTV 대시보드</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Malgun Gothic', sans-serif; background: #f0f0f0; }
        #header { padding: 15px; background: #222; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .btn-group button { padding: 8px 16px; margin-left: 5px; background: #444; color: #fff; border: 1px solid #666; cursor: pointer; border-radius: 4px; font-weight: bold; }
        #btn-back { display: none; background: #d35400; border-color: #e67e22; }
        #content { display: flex; flex: 1; overflow: hidden; }
        #map-container { flex: 2; position: relative; }
        #map { width: 100%; height: 100%; z-index: 1; }
        #video-container { flex: 1; background: #111; display: flex; flex-direction: column; padding: 10px; border-left: 2px solid #333; }
        #video-title { color: #fff; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        .region-label { background: transparent; border: none; box-shadow: none; font-weight: 800; color: #111; text-shadow: -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff, 1px 1px 2px #fff; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <div id="header">
        <span id="current-location-text">대한민국 (시/도를 선택하거나 검색하세요)</span>
        <div class="btn-group">
            <button id="btn-back" onclick="goBack()">◀ 이전 화면</button>
            <button onclick="resetMap()">전국 초기화</button>
        </div>
    </div>
    <div id="content">
        <div id="map-container">
            <div id="map"></div>
        </div>
        <div id="video-container">
            <div id="video-title" style="color:yellow;">[테스트 모드] 지역 검색 및 선택 테스트</div>
            <div class="placeholder" style="color:#888; text-align:center; padding-top:20px;">지도 우측 상단의 돋보기 아이콘을 클릭하여 지역을 검색하십시오.</div>
        </div>
    </div>

    <script>
        const SIDO_GEOJSON_URL = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_provinces_geo_simple.json';
        const southKoreaBounds = L.latLngBounds(L.latLng(33.0, 125.0), L.latLng(38.5, 131.5));

        let map = L.map('map', {
            center: [35.8, 127.5],
            zoom: 7,
            minZoom: 7,
            maxBounds: southKoreaBounds,
            maxBoundsViscosity: 1.0
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 검색창 추가
        L.Control.geocoder({
            defaultMarkGeocode: true,
            placeholder: "지역명 검색 (예: 양양군)"
        }).addTo(map);

        let sidoLayer = null;

        // 초기 데이터 로드
        async function loadSido() {
            const response = await fetch(SIDO_GEOJSON_URL);
            const data = await response.json();
            sidoLayer = L.geoJSON(data, {
                style: { color: '#3388ff', weight: 2, fillOpacity: 0.1 },
                onEachFeature: function(feature, layer) {
                    layer.bindTooltip(feature.properties.name, { 
                        permanent: true, direction: "center", className: "region-label" 
                    });
                    layer.on('click', function() {
                        document.getElementById('current-location-text').innerText = `${feature.properties.name} 선택됨`;
                        map.fitBounds(layer.getBounds());
                    });
                }
            }).addTo(map);
        }

        function goBack() {
            map.setView([35.8, 127.5], 7);
            document.getElementById('current-location-text').innerText = '대한민국 (시/도를 선택하거나 검색하세요)';
        }

        function resetMap() { goBack(); }

        loadSido();
    </script>
</body>
</html>
